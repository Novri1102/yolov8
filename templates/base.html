<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Deteksi Kecambah Kelapa Sawit{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>

<body>
    <div id="toastContainer" class="toast-container"></div>

    <header class="navbar">
        <div class="navbar-inner">
            <div class="brand">
                <img src="{{ url_for('static', filename='img/logo_ppks1.png') }}" alt="Logo PPKS" class="brand-logo">
                <div>
                    <div class="brand-title">Deteksi Kecambah Sawit</div>
                    <div class="brand-sub">Pusat Penelitian Kelapa Sawit</div>
                </div>
            </div>
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == '/' else '' }}">Deteksi</a>
                <a href="{{ url_for('riwayat') }}"
                    class="{{ 'active' if request.path == '/riwayat' else '' }}">Riwayat</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Sistem Deteksi Kecambah Layak Salur &mdash; Model AI YOLOv8 (TFLite)</p>
    </footer>

    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
